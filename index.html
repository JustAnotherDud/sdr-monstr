<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0D0B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SDR → MONSTR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0A0D0B; --surface:#111815; --surface2:#161F1A; --line:#233028;
    --green:#7CFF3D; --green-dim:#4A9E2A; --amber:#FFB100;
    --text:#EFF5EE; --muted:#6C7A70;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px 60px;padding-top:calc(20px + env(safe-area-inset-top));}
  .app{width:100%;max-width:430px;}
  header{text-align:center;margin-bottom:6px;}
  .brand{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;letter-spacing:2px;color:var(--green);text-shadow:0 0 18px rgba(124,255,61,0.35);}
  .brand span{color:var(--amber);text-shadow:0 0 18px rgba(255,177,0,0.35);}
  .sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
  .week{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-align:center;margin-top:10px;}
  .can-wrap{display:flex;justify-content:center;margin:18px 0 16px;}
  .can{position:relative;width:88px;height:150px;border-radius:10px 10px 16px 16px;background:var(--surface);border:2px solid var(--line);overflow:hidden;}
  .can-tab{width:34px;height:8px;background:var(--line);border-radius:4px 4px 0 0;margin:0 auto;}
  .can-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg, var(--green) 0%, var(--green-dim) 100%);transition:height 0.5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 20px rgba(124,255,61,0.4);}
  .can-fill.over{background:linear-gradient(180deg, var(--amber) 0%, #C97F00 100%);box-shadow:0 0 20px rgba(255,177,0,0.4);}
  .total{text-align:center;margin-bottom:4px;}
  .total .amount{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:42px;color:var(--green);text-shadow:0 0 24px rgba(124,255,61,0.3);}
  .total .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
  .split-row{text-align:center;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:6px;}
  .count-row{display:flex;justify-content:center;gap:18px;margin:10px 0 22px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .count-row b{color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;}
  .qty-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
  .qty-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--green);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .qty-btn:active{transform:scale(0.94);}
  .qty-val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;min-width:36px;text-align:center;}
  .source-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .source-btn{padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3;}
  .source-btn small{display:block;color:var(--muted);font-weight:400;font-size:10.5px;margin-top:2px;}
  .source-btn.active{border-color:var(--green);color:var(--green);box-shadow:0 0 0 1px var(--green) inset;}
  .add-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--green);color:#0A0D0B;font-weight:700;font-size:14px;letter-spacing:0.5px;cursor:pointer;}
  .add-btn:disabled{opacity:0.5;}
  .invest-btn{width:100%;padding:14px;border-radius:10px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-weight:700;font-size:13px;letter-spacing:0.5px;cursor:pointer;margin-top:6px;}
  .invest-btn:disabled{opacity:0.3;border-color:var(--line);color:var(--muted);cursor:not-allowed;}
  .invest-form{background:var(--surface);border:1px solid var(--amber);border-radius:10px;padding:14px;margin-top:6px;}
  .invest-form-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .invest-form-row b{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--amber);}
  .invest-input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:8px;}
  .invest-input::placeholder{color:var(--muted);}
  .invest-actions{display:flex;gap:8px;margin-top:4px;}
  .invest-actions button{flex:1;padding:11px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .invest-cancel{border:1px solid var(--line);background:transparent;color:var(--muted);}
  .invest-confirm{border:none;background:var(--amber);color:#0A0D0B;}
  .entry-block{border-bottom:1px dashed var(--line);padding:7px 0;}
  .entry-block:last-child{border-bottom:none;}
  .entry-block .entry{border-bottom:none;padding:0;}
  .entry-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding-top:2px;}
  .receipt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;}
  .receipt h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;}
  .entry{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--text);}
  .entry:last-child{border-bottom:none;}
  .entry .meta{color:var(--muted);font-size:10.5px;}
  .entry .val{color:var(--green);font-weight:600;}
  .entry.invest .val{color:var(--amber);}
  .entry .right{display:flex;align-items:center;gap:8px;}
  .del-btn{background:none;border:none;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;padding:2px 4px;font-family:'IBM Plex Mono',monospace;}
  .del-btn:active{color:#FF5C5C;}
  .empty{text-align:center;color:var(--muted);font-size:12px;padding:14px 0;}
  .status{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;font-family:'IBM Plex Mono',monospace;}
  .status.err{color:#FF5C5C;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">SDR → <span>MONSTR</span></div>
    <div class="sub">deposit bottle tracker</div>
    <div class="week" id="weekRange"></div>
  </header>

  <div class="can-wrap">
    <div>
      <div class="can-tab"></div>
      <div class="can"><div class="can-fill" id="canFill" style="height:0%"></div></div>
    </div>
  </div>

  <div class="total">
    <div class="amount" id="totalAmount">€0.00</div>
    <div class="label">to invest</div>
  </div>
  <div class="split-row" id="splitRow"></div>
  <div class="count-row">
    <span id="bottlesLine"><b id="totalBottles">0</b> bottles</span>
    <span id="investedLine"><b id="investedTotal">€0.00</b> already invested</span>
  </div>

  <div class="card">
    <h3>Log bottles</h3>
    <div class="qty-row">
      <div class="qty-btn" id="qtyMinus">−</div>
      <div class="qty-val" id="qtyVal">1</div>
      <div class="qty-btn" id="qtyPlus">+</div>
    </div>
    <div class="source-grid">
      <div class="source-btn active" data-source="found">Found<small>street/bin</small></div>
      <div class="source-btn" data-source="own_deposit">Own deposit<small>reclaiming</small></div>
      <div class="source-btn" data-source="brother">Brother's<small>owed back</small></div>
    </div>
    <button class="add-btn" id="addBtn">Add</button>
  </div>

  <button class="invest-btn" id="investBtn" disabled>Mark as invested (Monster buy)</button>
  <div class="invest-form" id="investForm" style="display:none;">
    <div class="invest-form-row"><span>Amount</span><b id="investAmount">€0.00</b></div>
    <input class="invest-input" type="number" id="sharePriceInput" placeholder="Price per share (optional)" step="0.01" min="0" inputmode="decimal">
    <input class="invest-input" type="number" id="sharesInput" placeholder="Shares bought (optional)" step="0.0001" min="0" inputmode="decimal">
    <div class="invest-actions">
      <button class="invest-cancel" id="investCancel">Cancel</button>
      <button class="invest-confirm" id="investConfirm">Confirm</button>
    </div>
  </div>

  <div class="receipt" style="margin-top:14px;">
    <h3>History</h3>
    <div id="log"><div class="empty">loading…</div></div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://yvsjchzvoikqlpbqsphs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KyVdGk01DDLgQ9aGsBhHdQ_UdKEn8Wh';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RATE = 0.10;
const CAP = 10; // weekly target shown by the can bar
let qty = 1;
let source = 'found';

const qtyVal = document.getElementById('qtyVal');
const canFill = document.getElementById('canFill');
const totalAmount = document.getElementById('totalAmount');
const splitRow = document.getElementById('splitRow');
const bottlesLine = document.getElementById('bottlesLine');
const logEl = document.getElementById('log');
const investBtn = document.getElementById('investBtn');
const investForm = document.getElementById('investForm');
const investAmount = document.getElementById('investAmount');
const sharePriceInput = document.getElementById('sharePriceInput');
const sharesInput = document.getElementById('sharesInput');
const investCancel = document.getElementById('investCancel');
const investConfirm = document.getElementById('investConfirm');
const addBtn = document.getElementById('addBtn');
const statusLine = document.getElementById('statusLine');
const weekRange = document.getElementById('weekRange');
const investedLine = document.getElementById('investedLine');

let pendingTotal = 0;

function fmt(n){ return '€' + n.toFixed(2); }
function fmtShares(n){ return (Math.round(Number(n) * 10000) / 10000).toString(); }
function setStatus(msg, isErr){ statusLine.textContent = msg; statusLine.className = 'status' + (isErr ? ' err' : ''); }

function pad2(n){ return String(n).padStart(2, '0'); }
function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function getWeekBounds(){
  const now = new Date();
  const day = (now.getDay() + 6) % 7; // Monday = 0
  const mon = new Date(now); mon.setDate(now.getDate() - day);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { mon, sun, monStr: isoDate(mon), sunStr: isoDate(sun) };
}

function currentWeekRange(){
  const { mon, sun } = getWeekBounds();
  const f = d => d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit'});
  weekRange.textContent = `week ${f(mon)} – ${f(sun)}`;
}
currentWeekRange();

document.getElementById('qtyMinus').onclick = () => { qty = Math.max(1, qty-1); qtyVal.textContent = qty; };
document.getElementById('qtyPlus').onclick = () => { qty = Math.min(50, qty+1); qtyVal.textContent = qty; };

document.querySelectorAll('.source-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    source = btn.dataset.source;
  };
});

async function loadAndRender(){
  setStatus('syncing…');
  const { data: pending, error: e1 } = await supabase.from('bottle_log').select('*').is('invested_at', null).order('logged_date', {ascending:false});
  const { data: investedRows, error: e2 } = await supabase.from('bottle_log').select('value, invested_at').not('invested_at', 'is', null);
  const { data: investmentRows, error: e3 } = await supabase.from('investments').select('invested_at, amount, share_price, shares');

  if(e1 || e2 || e3){ setStatus('connection error — retrying', true); return; }

  const total = (pending || []).reduce((s,e) => s + Number(e.value), 0);
  const bottles = (pending || []).reduce((s,e) => s + (e.source === 'seed' ? 0 : e.qty), 0);
  const investedSum = (investedRows || []).reduce((s,e) => s + Number(e.value), 0);
  const sharesHeld = (investmentRows || []).reduce((s,r) => s + (r.shares != null ? Number(r.shares) : 0), 0);

  pendingTotal = total;
  totalAmount.textContent = fmt(total);
  bottlesLine.innerHTML = `<b>${bottles}</b> ${bottles === 1 ? 'bottle' : 'bottles'}`;
  investedLine.innerHTML = `<b>${fmt(investedSum)}</b> already invested` + (sharesHeld > 0 ? ` · ${fmtShares(sharesHeld)} shares held` : '');
  investBtn.disabled = total <= 0;

  const { monStr, sunStr } = getWeekBounds();
  const weekTotal = (pending || []).reduce((s,e) => {
    const ld = e.logged_date;
    return (e.source !== 'seed' && ld >= monStr && ld <= sunStr) ? s + Number(e.value) : s;
  }, 0);
  const overCap = weekTotal > CAP;
  canFill.style.height = Math.min(100, (weekTotal / CAP) * 100) + '%';
  canFill.classList.toggle('over', overCap);

  const bySource = { found: 0, own_deposit: 0, brother: 0 };
  (pending || []).forEach(e => { if(e.source in bySource) bySource[e.source] += Number(e.value); });
  const parts = [];
  if(bySource.found > 0) parts.push(`${fmt(bySource.found)} profit`);
  if(bySource.own_deposit > 0) parts.push(`${fmt(bySource.own_deposit)} reclaimed`);
  if(bySource.brother > 0) parts.push(`${fmt(bySource.brother)} brother's`);
  splitRow.textContent = parts.join(' · ');

  // group invested rows by invested_at batch for the log
  const investBatches = {};
  (investedRows || []).forEach(r => {
    const k = r.invested_at;
    investBatches[k] = (investBatches[k] || 0) + Number(r.value);
  });
  const investDetails = {};
  (investmentRows || []).forEach(r => { investDetails[r.invested_at] = r; });
  const investEntries = Object.entries(investBatches).map(([date, value]) => ({type:'invest', date, value, detail: investDetails[date]}));
  const pendingEntries = (pending || []).map(e => ({type:'entry', id: e.id, date: e.created_at, qty: e.qty, source: e.source, value: Number(e.value)}));

  const items = [...pendingEntries, ...investEntries].sort((a,b) => new Date(b.date) - new Date(a.date));

  if(items.length === 0){
    logEl.innerHTML = '<div class="empty">no entries yet</div>';
  } else {
    const labels = {found:'found', own_deposit:'own deposit', brother:"brother's"};
    logEl.innerHTML = items.slice(0,30).map(it => {
      const d = new Date(it.date);
      const dstr = d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit'});
      if(it.type === 'invest'){
        const det = it.detail;
        let sub = '';
        if(det && (det.shares != null || det.share_price != null)){
          const parts = [];
          if(det.shares != null) parts.push(`${fmtShares(det.shares)} shares`);
          if(det.share_price != null) parts.push(`@ ${fmt(Number(det.share_price))}`);
          sub = `<div class="entry-sub">${parts.join(' ')}</div>`;
        }
        return `<div class="entry-block"><div class="entry invest"><span>${dstr} · invested</span><span class="val">−${fmt(it.value)}</span></div>${sub}</div>`;
      }
      if(it.source === 'seed'){
        return `<div class="entry"><span>${dstr} · <span class="meta">opening balance</span></span><span class="right"><span class="val">+${fmt(it.value)}</span><button class="del-btn" data-id="${it.id}" title="delete">✕</button></span></div>`;
      }
      return `<div class="entry"><span>${dstr} · ${it.qty}× <span class="meta">${labels[it.source] || it.source}</span></span><span class="right"><span class="val">+${fmt(it.value)}</span><button class="del-btn" data-id="${it.id}" title="delete">✕</button></span></div>`;
    }).join('');
    logEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = async () => {
        if(!confirm('Delete this entry?')) return;
        btn.disabled = true;
        const { error } = await supabase.from('bottle_log').delete().eq('id', btn.dataset.id);
        if(error){ setStatus('delete failed: ' + error.message, true); return; }
        await loadAndRender();
      };
    });
  }
  setStatus('synced');
}

addBtn.onclick = async () => {
  addBtn.disabled = true;
  const value = qty * RATE;
  const row = { qty, source, value, unit_value: RATE };
  const { error } = await supabase.from('bottle_log').insert(row);
  addBtn.disabled = false;
  if(error){ setStatus('save failed: ' + error.message, true); return; }
  qty = 1; qtyVal.textContent = 1;
  await loadAndRender();
};

investBtn.onclick = () => {
  investAmount.textContent = fmt(pendingTotal);
  investForm.style.display = 'block';
  investBtn.style.display = 'none';
};

investCancel.onclick = () => {
  investForm.style.display = 'none';
  investBtn.style.display = 'block';
  sharePriceInput.value = '';
  sharesInput.value = '';
};

investConfirm.onclick = async () => {
  investConfirm.disabled = true;
  const now = new Date().toISOString();
  const amount = pendingTotal;
  const price = sharePriceInput.value !== '' ? Number(sharePriceInput.value) : null;
  const shares = sharesInput.value !== '' ? Number(sharesInput.value) : null;

  const { error: updErr } = await supabase.from('bottle_log').update({ invested_at: now }).is('invested_at', null);
  if(updErr){ setStatus('mark as invested failed: ' + updErr.message, true); investConfirm.disabled = false; return; }

  const { error: insErr } = await supabase.from('investments').insert({ invested_at: now, amount, share_price: price, shares });

  investConfirm.disabled = false;
  sharePriceInput.value = '';
  sharesInput.value = '';
  investForm.style.display = 'none';
  investBtn.style.display = 'block';
  await loadAndRender();

  if(insErr){ setStatus('bottles marked as invested, but the investment record failed to save: ' + insErr.message, true); }
};

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

loadAndRender();
</script>
</body>
</html>
